<title>Циклова комісія кіно-, фото- та відеосправи</title>

<body>
<!--
  САЙТ ЦИКЛОВОЇ КОМІСІЇ (бета 1.4)
  Весь вміст сайту береться з Google Таблиці; сам файл змінювати не потрібно, крім кількох налаштувань нижче.

  УСТАНОВКА: у Google Sites — Вставити → Вбудувати → Код вбудовування; або завантажте як index.html на власний хостинг (тоді FULL_PAGE = true).

  СТРУКТУРА ФАЙЛА
    1. блок style     — оформлення (меню, картки, вікна, галереї, панорама, мобільна версія)
    2. HTML-каркас    — банер, меню, ліва панель, вміст, вікна (профіль, папка, перегляд фото)
    3. блок script:
       1) НАЛАШТУВАННЯ     — SHEET_URL, DRIVE_API_KEY, SETTINGS_URL, FULL_PAGE
       2) ДЕМО-ДАНІ         — приклад вмісту, поки таблицю не підключено
       3) ДОПОМІЖНІ ФУНКЦІЇ — розбір CSV, посилання, дати, текст
       4) БЛОКИ СТОРІНКИ    — як кожен тип рядка (текст, картка, відео…) перетворюється на HTML
       5) ДОДАТКОВІ МОДУЛІ  — панорама 360°, галереї, вікно викладача, повний екран, налаштування вигляду
       6) НАВІГАЦІЯ І ПОДІЇ — розділи, меню, кліки, клавіатура
       7) ЗАПУСК            — завантаження таблиці й побудова сторінки
-->
<style>
@import url("https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Golos+Text:wght@400;600&display=swap");
html,body{margin:0}
body{box-sizing:border-box;padding-left:var(--sw,0px);padding-right:var(--sw,0px)}
.kfvs{--v:#3a0f1a;--vd:#1c070d;--beam:#ffe9b0;--amber:#f2a93b;--bg:#f6f3ee;--ink:#1d1416;--mute:#6a5b5f;--line:#e3dcd2;font:16px/1.55 var(--fb,"Golos Text"),system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.kfvs *{box-sizing:border-box}
.kfvs button{font:inherit;cursor:pointer}
.kfvs :focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* ---- Верхнє меню ---- */
.kfvs nav.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--vd)}
.kfvs nav.top button{border:0;background:transparent;color:var(--beam);padding:10px 16px;border-radius:8px;font-weight:600}
.kfvs nav.top button:hover{background:rgba(255,233,176,.12)}
.kfvs nav.top button[aria-current=true]{background:var(--amber);color:var(--vd)}
/* ---- Каркас: ліва панель + вміст ---- */
.kfvs .layout{display:grid;grid-template-columns:250px 1fr;min-height:70vh}
.kfvs .layout.solo{grid-template-columns:1fr}
.kfvs aside{background:var(--panel,#fff);border-right:1px solid var(--line);padding:20px 12px}
.kfvs aside h3{margin:0 0 10px 12px;font-size:14px;color:var(--mute);font-weight:600}
.kfvs aside button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-left:4px solid transparent;border-radius:0 8px 8px 0;color:var(--ink)}
.kfvs aside button:hover{background:#f3ece3}
.kfvs aside button[aria-current=true]{border-left-color:var(--amber);background:#fbf1de;font-weight:600}
.kfvs main{padding:28px clamp(16px,4vw,44px) 48px;max-width:980px}
/* ---- Заголовки й текст ---- */
.kfvs h1{margin:0 0 20px;font:700 clamp(24px,3.4vw,38px)/1.1 var(--fh,Unbounded),"Arial Black",sans-serif;color:var(--v)}
.kfvs h2{margin:28px 0 8px;font-size:1.3em;color:var(--v)}
.kfvs .blk{max-width:70ch}
.kfvs .blk.own h2{color:inherit}
.kfvs a{color:var(--v)}
.kfvs p{margin:0 0 10px}
/* ---- Картки ---- */
.kfvs .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:16px 0}
.kfvs .card{display:block;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
.kfvs a.card{cursor:pointer}
.kfvs a.card:hover{border-color:var(--amber);box-shadow:0 4px 14px rgba(58,15,26,.12)}
.kfvs .card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}
.kfvs .card div{padding:14px 16px}
.kfvs .card b{display:block;color:var(--v);margin-bottom:4px}
.kfvs .card span{font-size:14px;color:var(--mute)}
/* ---- Кнопки й файли ---- */
.kfvs .file,.kfvs .btn{display:block;margin:8px 0;padding:12px 16px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
.kfvs .btn{display:inline-block;background:var(--v);color:var(--beam);border:0;border-radius:8px;margin-top:4px}
.kfvs .file:hover{background:#fbf1de}
.kfvs .file small{display:block;font-weight:400;color:var(--mute)}
/* ---- Вбудовані відео й сторінки ---- */
.kfvs iframe{display:block;width:100%;height:480px;border:0;border-radius:12px;background:#fff;margin:8px 0}
.kfvs iframe.video{height:auto;aspect-ratio:16/9}
.kfvs iframe.fb{height:720px;max-width:520px}
.kfvs .photo{display:block;max-width:100%;max-height:80vh;width:auto;height:auto;border-radius:12px;margin:8px 0}
/* ---- Картка-прев’ю посилання ---- */
.kfvs .lp{display:block;max-width:560px;margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
.kfvs .lp:hover{border-color:var(--amber);box-shadow:0 4px 14px rgba(58,15,26,.12)}
.kfvs .lpi{display:flex;gap:2px;height:170px;background:#eee}
.kfvs .lpi[hidden]{display:none}
.kfvs .lpi img{flex:1 1 0;min-width:0;height:100%;object-fit:cover}
.kfvs .lpb{padding:14px 16px}
.kfvs .lpt{display:block;color:var(--v)}
.kfvs .lpd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:14px}
.kfvs .lph{display:block;margin-top:8px;color:var(--mute);font-size:12px}
.kfvs .card[data-go],.kfvs .btn[data-go]{cursor:pointer}
.kfvs .card[data-go]:hover{border-color:var(--amber);box-shadow:0 4px 14px rgba(58,15,26,.12)}
/* ---- Галереї та переглядач фото ---- */
.kfvs .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.kfvs .gal button{border:0;padding:0;aspect-ratio:1;background:#e9e3da;border-radius:8px;overflow:hidden;cursor:pointer}
.kfvs .gal img{display:block;width:100%;height:100%;object-fit:cover}
.kfvs iframe.gridf{height:520px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
#lb[hidden]{display:none}
#lb img{max-width:88%;max-height:90%;object-fit:contain}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:34px;width:52px;height:52px;border-radius:50%;cursor:pointer}
#lbp{left:12px}#lbn{right:12px}#lbx{top:12px;right:12px}
.kfvs .ver{padding:6px 16px;font-size:11px;color:#9a8d90;text-align:right}
/* ---- Вікно картки викладача ---- */
#pm{position:fixed;inset:0;z-index:40;background:rgba(20,8,10,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
#pm[hidden]{display:none}
.kfvs .pmp{position:relative;width:100%;max-width:860px;margin:auto 0;background:var(--bg);border-radius:14px;padding:24px}
#pmx{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:#fff;font-size:22px;cursor:pointer}
.kfvs .pmh{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:24px;align-items:start}
.kfvs .pmh>img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:12px;background:#e9e3da}
.kfvs .pmh h2{margin-top:0}
.kfvs .pmr{color:var(--mute);font-weight:600}
.kfvs .pmp h3{margin:24px 0 8px;color:var(--v)}
.kfvs .pmg button{aspect-ratio:4/3;background:#fff;border:1px solid var(--line)}
.kfvs .pmg img{object-fit:contain}
.kfvs .card[data-p]{cursor:pointer}
.kfvs .card[data-p]:hover{border-color:var(--amber);box-shadow:0 4px 14px rgba(58,15,26,.12)}
.kfvs .card[data-p] img{aspect-ratio:1/1;object-position:center top}
.kfvs .more{display:block;margin-top:8px;color:var(--v);font-weight:600}
@media(max-width:700px){.kfvs .pmh{grid-template-columns:1fr}.kfvs .pmh>img{max-width:260px}}
/* ---- Панорама 360° ---- */
.kfvs .pano{position:relative;margin:8px 0;border-radius:12px;overflow:hidden;background:#15090c;min-height:120px}
.kfvs .pcv{display:block;width:100%;cursor:grab;touch-action:none}
.kfvs .pcv:active{cursor:grabbing}
.kfvs .pz{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.kfvs .pz button{width:36px;height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.88);font-size:20px;cursor:pointer}
.kfvs .phint{margin:0;padding:16px;color:#e6dccd}
.kfvs .pcap{display:block;color:var(--mute);margin-bottom:10px}
/* ---- Банер (налаштовується в аркуші «Налаштування») ---- */
#banner{position:relative;display:flex;align-items:flex-end;background:var(--vd) center/cover no-repeat;color:var(--bc,#fff)}
#banner[hidden]{display:none}
#banner::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 25%,rgba(0,0,0,.55))}
#bmedia,#bfilm{position:absolute;inset:0;overflow:hidden;z-index:0}
#bmedia video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bmedia iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:0;pointer-events:none}
#banner .bt{position:relative;z-index:2;padding:20px clamp(16px,4vw,44px)}
#banner b{display:block;font:700 clamp(22px,4vw,44px)/1.1 var(--fh,Unbounded),sans-serif}
#banner span{display:block;margin-top:6px;font-size:clamp(14px,1.6vw,20px)}
/* ---- Кнопка «на весь екран» і повноекранний режим ---- */
.kfvs .fsw{position:relative}
.kfvs .fsb{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.kfvs .fsw.fs,.kfvs .fsw:fullscreen{background:#000;border-radius:0}
.kfvs .fsw.fs{position:fixed;inset:0;z-index:60;margin:0;display:flex;align-items:center;justify-content:center}
.kfvs .fsw.fs iframe,.kfvs .fsw:fullscreen iframe{width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:0}
.kfvs img.photo{cursor:zoom-in}
/* ---- Порівняння «до / після» ---- */
.kfvs .ba{position:relative;overflow:hidden;margin:10px 0;border-radius:12px;line-height:0;user-select:none;--p:50%}
.kfvs .ba img{display:block;width:100%;height:auto;max-height:80vh;object-fit:cover}
.kfvs .ba .baa{position:absolute;inset:0;height:100%;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.kfvs .ba .bar{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.kfvs .ba::after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.kfvs .bah{position:absolute;top:50%;left:var(--p);z-index:2;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;color:#333;font-size:18px;line-height:38px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
.kfvs .bal{position:absolute;bottom:10px;left:10px;padding:3px 10px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1.5;pointer-events:none}
.kfvs .bal.r{left:auto;right:10px}
.kfvs .ba.fs{display:block}
.kfvs .ba.fs img{position:absolute;inset:0;height:100%;max-height:none;object-fit:contain}
/* ---- Кнопки в картці викладача та вікно папки ---- */
.kfvs .pbtns{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.kfvs .pbtns .btn{margin:0;border:0;font:inherit;font-weight:600;cursor:pointer}
#fm{position:fixed;inset:0;z-index:45;background:rgba(20,8,10,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
#fm[hidden]{display:none}
#fmx{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:#fff;font-size:22px;cursor:pointer}
.kfvs .ft{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kfvs .fi{padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;text-align:left;cursor:pointer}
.kfvs .fi:hover{border-color:var(--amber)}
.kfvs .fi img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;background:#eee}
.kfvs .fi span{display:block;padding:8px 10px;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.kfvs .pdesc{margin-top:6px}
.kfvs p{overflow-wrap:anywhere}
/* ---- Карта з координатами ---- */
.kfvs .map{position:relative;display:block;max-width:560px;height:240px;margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit}
.kfvs .map iframe{width:100%;height:100%;border:0;pointer-events:none}
.kfvs .mapb{position:absolute;left:10px;bottom:10px;padding:6px 12px;border-radius:8px;background:var(--v);color:#fff;font-size:14px;font-weight:600}
/* ---- Підкладка під сайтом (зображення + відтінок), видна з боків і крізь прозорий фон ---- */
.kfvs{position:relative;z-index:1}
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#backdrop[hidden]{display:none}
#bdimg,#bdtint{position:absolute;inset:0}
#bdimg{background:center/cover no-repeat}
.kfvs .note{margin:0;padding:8px 16px;background:#fbf1de;color:var(--v);font-size:14px}
@media(max-width:760px){.kfvs .layout{grid-template-columns:1fr}.kfvs aside{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 8px;border-right:0;border-bottom:1px solid var(--line)}.kfvs aside h3{display:none}.kfvs aside button{flex:0 0 auto;width:auto;white-space:nowrap;padding:13px 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent}.kfvs aside button:hover{background:transparent}.kfvs aside button[aria-current=true]{border-left-color:transparent;border-bottom-color:var(--amber);background:transparent;font-weight:600}}
/* ---- Мобільна версія ---- */
@media(max-width:760px){
  body{padding-left:min(var(--sw,0px),3vw);padding-right:min(var(--sw,0px),3vw)}
  .kfvs nav.top{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 8px}
  .kfvs nav.top button{flex:0 0 auto;padding:10px 12px;font-size:15px}
  .kfvs main{padding:18px 14px 36px}
  .kfvs h1{font-size:24px}
  .kfvs .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .kfvs iframe{height:380px}.kfvs iframe.video{height:auto}.kfvs iframe.fb{max-width:100%}
  .kfvs .lp{max-width:100%}
  #pm,#fm{padding:0}.kfvs .pmp{min-height:100%;border-radius:0;padding:16px 14px}
  #lb button{width:44px;height:44px}
}
</style>

<div id="backdrop" hidden><div id="bdimg"></div><div id="bdtint"></div></div>
<div class="kfvs" id="kfvs">
  <div class="note" id="note" hidden></div>
  <header id="banner" hidden><div id="bmedia"></div><div id="bfilm"></div><div class="bt"><b id="bt1"></b><span id="bt2"></span></div></header>
  <nav class="top" id="top" aria-label="Розділи сайту"></nav>
  <div class="layout" id="layout"><aside id="side" aria-label="Підрозділи"></aside><main id="main"><p>Завантаження… Якщо цей напис не зникає, у цьому режимі не виконуються скрипти.</p></main></div>
  <div id="fm" hidden><div class="pmp" role="dialog" aria-modal="true"><button id="fmx" aria-label="Закрити">×</button><h3 id="fmt"></h3><div id="fmc"></div></div></div>
  <div id="pm" hidden><div class="pmp" role="dialog" aria-modal="true"><button id="pmx" aria-label="Закрити">×</button><div id="pmc"></div></div></div>
  <div id="lb" hidden><button id="lbp" aria-label="Попереднє">‹</button><img id="lbimg" alt=""><button id="lbn" aria-label="Наступне">›</button><button id="lbx" aria-label="Закрити">×</button></div>
  <div class="ver">бета 1.4</div>
</div>

<script>
/* ================= 1. НАЛАШТУВАННЯ ================= */
// 1) Посилання на опубліковану CSV-таблицю (інструкція в чаті). Поки порожнє, показується демо-вміст.
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQb8uuiVdBzc-WNsl-n8B_PnvH-5YgRne_yHxQzwJeMtEy6K_BxNgv5Onza9BVE-WFTYuSQsuN-xBv7/pub?gid=1403709242&single=true&output=csv";

// 1б) Ключ Google Drive API для галерей із папок (необов’язково; інструкція в чаті). Без ключа папка показується вбудованою сіткою Диска.
const DRIVE_API_KEY = "AIzaSyBrupiflflOlGoPWYDmO9n_0DToTe-sR4s";

// 1в) Посилання на опубліковану CSV-версію аркуша «Налаштування» (кольори, шрифти, банер). Необов’язково.
const SETTINGS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQb8uuiVdBzc-WNsl-n8B_PnvH-5YgRne_yHxQzwJeMtEy6K_BxNgv5Onza9BVE-WFTYuSQsuN-xBv7/pub?gid=1758252892&single=true&output=csv";

// 1г) true — повна сторінка на власному хостингу (index.html), false — вбудова в Google Sites.
const FULL_PAGE = true;

/* ================= 2. ДЕМО-ДАНІ (показуються, поки не підключено таблицю) ================= */
const DEMO = `Розділ,Підрозділ,Тип,Заголовок,Текст,Посилання,Зображення,Показувати,Колір,Розмір,Ширина,Шрифт,Вирівнювання,Докладно,Грамоти,Діє з,Діє до,Кнопки
Головна,,текст,"Циклова комісія кіно-, фото- та відеосправи","Ми готуємо фахівців, які вміють розповідати історії зображенням і звуком: від ідеї та сценарію до зйомки, монтажу й показу готового фільму.
На цьому сайті вступники знайдуть інформацію про навчання, студенти — матеріали й розклад, а партнери — приклади робіт і контакти для співпраці.",,,так,,,,,,,,,,
Головна,,картка,Вступникам,"Дізнайтеся, чого ми навчаємо, як вступити та що чекає на студента.",#Вступникам,,так,,,,,,,,,,
Головна,,картка,Студентам,"Розклад, навчальні матеріали, завдання та заявки на техніку.",#Студентам,,так,,,,,,,,,,

  // Зображення на фоні вмісту з напівпрозорим шаром кольору фону
  const bu = o["зображення фону"] ? imgUrl(o["зображення фону"], 2000) : "";
  if (bu) { const n = parseInt(o["фон прозорість"], 10), a = (isNaN(n) ? 60 : Math.min(100, Math.max(0, n))) / 100, c = bgRgb(getComputedStyle(root).getPropertyValue("--bg")); root.style.backgroundImage = `linear-gradient(rgba(${c},${a}),rgba(${c},${a})),url("${bu.replace(/"/g, "%22")}")`; root.style.backgroundSize = "cover"; }
  // Прозорість фону сайту: 0 — суцільний, 100 — повністю прозорий (видно підкладку)
  const kk = 1 - pn("прозорість фону сайту", 0) / 100;
  if (kk < 1) { if (!bu) root.style.backgroundColor = `rgba(${bgRgb(getComputedStyle(root).getPropertyValue("--bg"))},${kk})`; root.style.setProperty("--panel", `rgba(${bgRgb(o["колір панелі меню"] || "#FFFFFF")},${kk})`); }
  const b = $("banner"), show = FULL_PAGE || /^(так|yes|1)$/i.test(o["показувати банер"] || "");
  const vid = o["банер відео"], gif = o["банер gif"];
  if (!show || !(o["банер зображення"] || o["банер заголовок"] || vid || gif)) { b.hidden = true; return; }
  const h = parseInt(o["банер висота"], 10), still = o["банер зображення"] ? imgUrl(o["банер зображення"], 2400) : "";
  const gifUrl = gif ? (/drive\.google/.test(gif) && driveId(gif) ? `https://drive.google.com/uc?export=view&id=${driveId(gif)}` : safeUrl(gif)) : "";
  b.hidden = false; b.style.height = (h >= 100 && h <= 700 ? h : 260) + "px";
  const pic = gifUrl || still; if (pic) b.style.backgroundImage = 'url("' + pic.replace(/"/g, "%22") + '")';
  $("bt1").textContent = o["банер заголовок"] || ""; $("bt2").textContent = o["банер підзаголовок"] || "";
  // Відео на банері: без звуку, по колу, під напівпрозорою «плівкою»
  if (vid) mountBannerVideo(b, vid);
  const fc = o["банер плівка колір"], fa = parseInt(o["банер плівка прозорість"], 10), alpha = isNaN(fa) ? (vid ? 40 : 0) : Math.min(100, Math.max(0, fa));
  $("bfilm").style.background = alpha ? `rgba(${bgRgb(fc && okColor(fc) ? fc : "#3A0F1A")},${alpha / 100})` : "";
}
// Перетворює колір #RGB / #RRGGBB на «r,g,b» (для напівпрозорих шарів).
function bgRgb(s){
  s = String(s || "").trim(); let m = s.match(/^#([0-9a-f]{6})$/i);
  if (m) { const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255].join(","); }
  m = s.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i);
  return m ? m.slice(1).map(x => parseInt(x + x, 16)).join(",") : "246,243,238";
}
// Вставляє фонове відео в банер: YouTube (рекомендовано) або пряме посилання на .mp4/.webm.
function mountBannerVideo(b, u){
  const box = $("bmedia"), yt = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  box.innerHTML = "";
  if (yt) {
    const f = document.createElement("iframe");
    f.src = `https://www.youtube.com/embed/${yt[1]}?autoplay=1&mute=1&controls=0&loop=1&playlist=${yt[1]}&playsinline=1&enablejsapi=1&modestbranding=1&rel=0&disablekb=1&iv_load_policy=3`;
    f.allow = "autoplay *; encrypted-media *"; f.tabIndex = -1; f.setAttribute("aria-hidden", "true"); f.title = "Відео-фон";
    box.appendChild(f);
    const fit = () => { const k = Math.max(b.clientWidth / 16, b.clientHeight / 9); f.style.width = 16 * k + "px"; f.style.height = 9 * k + "px"; };
    fit(); window.addEventListener("resize", fit);
    // Телефони іноді блокують автозапуск: пробуємо ще раз після завантаження й після першого дотику
    const kick = () => { try { f.contentWindow.postMessage(JSON.stringify({event: "command", func: "playVideo", args: []}), "*"); } catch (e) {} };
    f.addEventListener("load", () => { kick(); setTimeout(kick, 1500); });
    ["touchstart", "click"].forEach(ev => document.addEventListener(ev, kick, {once: true, passive: true}));
  } else if (/\.(mp4|webm|ogv)(\?|$)/i.test(u) || !/^https?:/i.test(u)) {
    const v = document.createElement("video");
    v.src = u; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = "auto"; v.setAttribute("webkit-playsinline", ""); v.setAttribute("aria-hidden", "true");
    const go2 = () => { const q = v.play(); if (q && q.catch) q.catch(() => {}); };
    v.addEventListener("canplay", go2); ["touchstart", "click"].forEach(ev => document.addEventListener(ev, go2, {once: true, passive: true}));
    box.appendChild(v); const pl = v.play(); if (pl && pl.catch) pl.catch(() => {});
  }
}

// Доповнює сторінку після відображення: панорами, галереї папок, картки-посилання.
// Іконка вкладки браузера: посилання на зображення (Диск чи пряме), назва файла в репозиторії або емодзі.
function setIcon(v){
  v = String(v || "").trim(); if (!v) return;
  let href = "";
  if (/^https?:\/\//i.test(v)) href = imgUrl(v, 128);
  else if (/^[\w.\/-]+\.(png|ico|svg|jpe?g|gif|webp)$/i.test(v)) href = v;
  else if (v.length <= 8) href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="82" font-size="84" text-anchor="middle">' + v.replace(/[<&>]/g, "") + "</text></svg>");
  if (!href) return;
  document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(x => x.remove());
  ["icon", "apple-touch-icon"].forEach(rel => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); });
}
function hydrate(){
  const m = $("main"); if (!m.querySelectorAll) return;
  m.querySelectorAll(".pano[data-src]").forEach(initPano);
  m.querySelectorAll(".gal[data-folder]").forEach(async el => {
    try { fillGal(el, (await listFolder(el.dataset.folder)).map(galItem)); }
    catch (e) { el.innerHTML = `<p>Не вдалося завантажити папку (${esc(e.message)}). Перевірте, що папка відкрита за посиланням і ключ API діє.</p>`; }
  });
  m.querySelectorAll(".lp[data-url]").forEach(async el => {
    const t = el.querySelector(".lpt"), d = el.querySelector(".lpd"), box = el.querySelector(".lpi");
    const info = await preview(el.dataset.url);
    const bad = !info || /^(facebook|log in|увійти|вхід)/i.test((info.title || "").trim());
    if (!bad) {
      if (!t.textContent && info.title) t.textContent = info.title;
      if (!d.textContent && info.description) d.textContent = info.description;
      const img = info.image && safeUrl(info.image.url);
      if (box.hidden && img) { const i = document.createElement("img"); i.src = img; i.alt = ""; i.referrerPolicy = "no-referrer"; box.appendChild(i); box.hidden = false; }
    }
    if (!t.textContent) t.textContent = "Відкрити публікацію";
  });
}
// Картка-прев’ю для зовнішнього посилання (тип «посилання»).
function linkCard(r, lu){
  const imgs = (r["Зображення"] || "").split(/[\s;]+/).filter(Boolean).slice(0, 4).map(imgUrl).filter(Boolean);
  let host = ""; try { host = new URL(lu).hostname.replace(/^www\./, ""); } catch (e) {}
  const desc = /^https?:\/\/\S+$/i.test(r["Текст"]) ? "" : r["Текст"];
  return `<a class="lp" ${linkAttrs(lu)} data-url="${esc(lu)}"><div class="lpi"${imgs.length ? "" : " hidden"}>${imgs.map(s => `<img src="${esc(s)}" referrerpolicy="no-referrer" loading="lazy" alt="">`).join("")}</div><div class="lpb"><b class="lpt">${esc(r["Заголовок"])}</b><span class="lpd">${esc(desc)}</span><small class="lph">${esc(host)}</small></div></a>`;
}
/* ================= 4. БЛОКИ СТОРІНКИ (рядок таблиці → HTML) ================= */
function block(r){
  const t = r["Тип"].toLowerCase(), title = r["Заголовок"] ? `<h2>${esc(r["Заголовок"])}</h2>` : "", la = linkAttrs(r["Посилання"]), txtUrl = /^https?:\/\/\S+$/i.test(r["Текст"]), raw = r["Посилання"] || r["Зображення"] || (txtUrl ? r["Текст"] : "");
  const tn = t.replace(/['’ʼ`\-_\s]/g, "");
  if (tn === "посилання" || tn === "превю") { const lu = safeUrl(r["Посилання"] || (txtUrl ? r["Текст"] : "")); return lu ? linkCard(r, lu) : ""; }
  if (tn === "панорама") { const u = safeUrl(raw); if (!u) return ""; const id = /drive\.google/.test(u) && driveId(u); return title + `<div class="pano fsw" data-src="${esc(id ? `https://lh3.googleusercontent.com/d/${id}=w4096` : u)}"><p class="phint">Завантаження панорами…</p></div><small class="pcap">Перетягніть фото, щоб оглянути приміщення з усіх боків.</small>${txtUrl || !r["Текст"] ? "" : `<div class="pdesc">${paras(r["Текст"])}</div>`}`; }
  if (tn === "карта") {
    const cm = [r["Посилання"], r["Текст"]].map(s => String(s || "").match(/@?(-?\d{1,3}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)/)).find(Boolean); if (!cm) return "";
    const [lat, lon] = [cm[1], cm[2]], plain = /^\s*@?-?\d{1,3}\.\d+\s*[,;]\s*-?\d{1,3}\.\d+\s*$/.test(r["Текст"] || "");
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    return title + `<a class="map" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank" rel="noopener" aria-label="Відкрити маршрут"><iframe src="https://www.google.com/maps?q=${lat},${lon}&z=15&output=embed" loading="lazy" tabindex="-1" title="Карта"></iframe><span class="mapb">Побудувати маршрут</span></a>${r["Текст"] && !plain ? paras(r["Текст"]) : ""}${ios ? `<a class="btn" href="https://maps.apple.com/?daddr=${lat},${lon}" target="_blank" rel="noopener">Відкрити в Apple Картах</a>` : ""}`;
  }
  if (tn === "допісля") { const [a, b] = (r["Зображення"] || "").split(/[\s;]+/).filter(Boolean).map(u => imgUrl(u)); if (!a || !b) return ""; return title + `<div class="ba fsw"${photoStyle(r)}><img src="${esc(b)}" referrerpolicy="no-referrer" alt="Після"><img class="baa" src="${esc(a)}" referrerpolicy="no-referrer" alt="До"><input class="bar" type="range" min="0" max="100" value="50" aria-label="Порівняння до і після"><span class="bah">↔</span><span class="bal">До</span><span class="bal r">Після</span><button type="button" class="fsb" data-fs aria-label="На весь екран">⛶</button></div>`; }
  if (tn === "галерея") { const id = driveId(raw); if (!id) return ""; return title + (DRIVE_API_KEY ? `<div class="gal" data-folder="${esc(id)}"><p>Завантаження…</p></div>` : `<iframe class="gridf" src="https://drive.google.com/embeddedfolderview?id=${esc(id)}#grid" loading="lazy" title="${esc(r["Заголовок"])}"></iframe>`); }
  if (t === "текст") return `<div class="blk${blockStyle(r).includes("color:")?" own":""}"${blockStyle(r)}>` + (r["Заголовок"] ? `<h2>${fmt(r["Заголовок"])}</h2>` : "") + paras(r["Текст"]) + (la ? `<a class="btn" ${la}>Докладніше</a>` : "") + `</div>`;
  if (t === "файл") return `<a class="file" ${linkAttrs(raw)}>${esc(r["Заголовок"])}${r["Текст"] && !txtUrl ? `<small>${esc(r["Текст"])}</small>` : ""}</a>`;
  if (t === "відео" || t === "вбудова"){const u = embedUrl(raw); return u ? title + `<iframe class="${/facebook\.com\/plugins/.test(u)?"fb":t==="відео"?"video":""}" src="${esc(u)}" loading="lazy" allowfullscreen allow="fullscreen *; autoplay *; encrypted-media *" title="${esc(r["Заголовок"])}"></iframe>` : ""}
  if (t === "фото") return title + `<img class="photo"${photoStyle(r)} referrerpolicy="no-referrer" src="${esc(imgUrl(r["Зображення"] || raw))}" alt="${esc(r["Заголовок"])}">`;
  return "";
}
// Картки викладачів: збереження даних і малювання картки.
let PROF = [];
function card(r){
  const hasP = !!((r["Докладно"] || "").trim() || (r["Грамоти"] || "").trim() || (r["Кнопки"] || "").trim());
  const inTxt = !hasP && !r["Посилання"] && /^#\S/.test(r["Текст"]);
  let la = hasP ? "" : linkAttrs(r["Посилання"] || (inTxt ? r["Текст"] : ""));
  if (!la && !hasP) { const k = [...S.keys()].find(k => norm(k) === norm(r["Заголовок"])); if (k) la = `data-go="${esc(k)}" role="link" tabindex="0"`; }
  let pa = ""; if (hasP) { PROF.push(r); pa = ` data-p="${PROF.length - 1}" role="button" tabindex="0"`; }
  const img = imgUrl(r["Зображення"]), tag = la && !la.includes("data-go") ? "a" : "div";
  const hint = la || hasP ? "" : ` data-hint="${esc("Картка «" + r["Заголовок"] + "» не пов’язана з розділом. У колонці «Посилання» зараз: «" + (r["Посилання"] || "") + "». Напишіть там #Назва розділу (як у колонці «Розділ»).")}"`;
  return `<${tag} class="card" ${la}${pa}${hint}>${img?`<img src="${esc(img)}" referrerpolicy="no-referrer" alt="" loading="lazy">`:""}<div><b>${esc(r["Заголовок"])}</b><span>${inTxt ? "" : fmt(r["Текст"]).replace(/\n+/g, " ")}</span>${hasP ? '<small class="more">Докладніше</small>' : ""}</div></${tag}>`;
}

// Малює меню, ліву панель і блоки вибраного розділу.
function draw(){
  PROF = [];
  const secs = S.get(cur.sec), subs = [...secs.keys()];
  $("top").innerHTML = [...S.keys()].map(k => `<button data-sec="${esc(k)}" ${k===cur.sec?'aria-current="true"':""}>${esc(k)}</button>`).join("");
  const showSide = subs.length > 1 || subs[0] !== "";
  $("layout").className = "layout" + (showSide ? "" : " solo");
  $("side").hidden = !showSide;
  $("side").innerHTML = showSide ? `<h3>${esc(cur.sec)}</h3>` + subs.map(k => `<button data-sub="${esc(k)}" ${k===cur.sub?'aria-current="true"':""}>${esc(k || "Огляд")}</button>`).join("") : "";
  let html = `<h1>${esc(cur.sub || cur.sec)}</h1>`, group = "";
  const flush = () => { if (group) { html += `<div class="cards">${group}</div>`; group = ""; } };
  secs.get(cur.sub).forEach(r => { if (r["Тип"].toLowerCase() === "картка") group += card(r); else { flush(); html += block(r); } });
  flush();
  $("main").innerHTML = html;
  hydrate();
  centerActive($("top")); centerActive($("side"));
}

document.addEventListener("error", e => {
  const el = e.target; if (!el || el.tagName !== "IMG") return;
  if (el.dataset.nofb) { el.style.visibility = "hidden"; return; }
  const m = el.src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)|[?&]id=([\w-]+)/), id = m && (m[1] || m[2]), step = +(el.dataset.step || 0);
  if (id && step < 2) { el.dataset.step = step + 1; el.src = driveAlts(id)[step]; }
  else if (el.classList.contains("photo")) { const p = document.createElement("p"); p.textContent = "Не вдалося завантажити фото. Перевірте, що файл відкрито для всіх, хто має посилання."; el.replaceWith(p); }
}, true);

let lb = {urls: [], i: 0};
// Великий перегляд фото: показ, перемикання, закриття.
const lbShow = () => { $("lbimg").src = lb.urls[lb.i]; };
const lbMove = d => { lb.i = (lb.i + d + lb.urls.length) % lb.urls.length; lbShow(); };
document.addEventListener("keydown", e => {
  if (!$("lb").hidden) { if (e.key === "Escape") $("lb").hidden = true; if (e.key === "ArrowLeft") lbMove(-1); if (e.key === "ArrowRight") lbMove(1); return; }
  if (e.key === "Escape") { const f = document.querySelector(".fsw.fs"); if (f) { f.classList.remove("fs"); return; } }
  if (!$("fm").hidden && e.key === "Escape") { $("fm").hidden = true; return; }
  if (!$("pm").hidden && e.key === "Escape") { $("pm").hidden = true; return; }
  const t = e.target; if ((e.key === "Enter" || e.key === " ") && t && t.dataset && (t.dataset.go !== undefined || t.dataset.p !== undefined)) { e.preventDefault(); t.click(); }
});
document.addEventListener("input", e => { const t = e.target; if (t.classList && t.classList.contains("bar")) t.parentNode.style.setProperty("--p", t.value + "%"); });
document.addEventListener("fullscreenchange", () => window.dispatchEvent(new Event("resize")));
document.addEventListener("click", e => {
  const fsb = e.target.closest("[data-fs]"); if (fsb) { toggleFs(fsb.closest(".fsw")); return; }
  const pb = e.target.closest(".pb"); if (pb) { openFolder(CURB[+pb.dataset.pb]); return; }
  const fi = e.target.closest(".fi"); if (fi) { openFile(+fi.dataset.f); return; }
  if (e.target.id === "fmx" || e.target.id === "fm") { $("fm").hidden = true; return; }
  const ph = e.target.closest("img.photo"); if (ph && !ph.closest(".gal")) { lb = {urls: [ph.src], i: 0}; $("lb").hidden = false; lbShow(); return; }
  const g = e.target.closest(".gal button");
  if (g) { lb = {urls: g.closest(".gal")._urls || [], i: +g.dataset.i}; $("lb").hidden = false; lbShow(); return; }
  if (e.target.id === "pmx" || e.target.id === "pm") { $("pm").hidden = true; return; }
  const pc = e.target.closest(".card[data-p]"); if (pc) { openProfile(+pc.dataset.p); return; }
  if (e.target.id === "lbx" || e.target.id === "lb") { $("lb").hidden = true; return; }
  if (e.target.id === "lbp") { lbMove(-1); return; }
  if (e.target.id === "lbn") { lbMove(1); return; }
  const hd = e.target.closest("[data-hint]"); if (hd) { warn(hd.dataset.hint); return; }
  const el = e.target.closest("[data-sec],[data-sub],[data-go]");
  if (!el) return;
  if (el.dataset.sec) go(el.dataset.sec);
  else if (el.dataset.sub !== undefined) go(cur.sec, el.dataset.sub);
  else { e.preventDefault(); go(el.dataset.go); }
});

(async () => {
  const note = m => { $("note").hidden = false; $("note").textContent = m; };

  try {
    const st = await loadSettings(); applySettings(st);
    // Діагностика для адміна: відкрийте сайт з додатком ?debug=1 до адреси
    if (/[?&]debug/.test(location.search)) { const n = $("note"); n.hidden = false; n.textContent = "Діагностика. Налаштування: " + (SET_INFO.url ? (SET_INFO.err ? "помилка — " + SET_INFO.err : "завантажено параметрів: " + SET_INFO.n) : "SETTINGS_URL не задано") + ". " + ["колір фону", "колір тексту", "колір меню", "колір акценту", "колір заголовків і кнопок"].map(k => k + " = " + (st[k] || "—") + (st[k] && !okColor(st[k]) ? " (НЕ КОЛІР)" : "")).join("; "); }
    let csv = DEMO;
    if (!SHEET_URL) note("Демо-режим: підключіть Google Таблицю (змінна SHEET_URL), щоб показати свій вміст.");
    else {
      $("main").innerHTML = "<p>Завантаження…</p>";
      try {
        const limit = new Promise((_, no) => setTimeout(() => no(new Error("час очікування вичерпано")), 10000));
        const r = await Promise.race([fetch(SHEET_URL, {cache:"no-store"}), limit]);
        if (!r.ok) throw new Error("статус " + r.status);
        csv = await r.text();
        if (/<html/i.test(csv.slice(0, 300))) throw new Error("отримано сторінку замість CSV");
      } catch (e) { note("Не вдалося завантажити таблицю (" + e.message + "). Показано демо-вміст. Перевірте, що таблиця опублікована в Інтернеті у форматі CSV."); }
    }
    build(csv);
  } catch (e) { note("Помилка: " + e.message); }
})();
